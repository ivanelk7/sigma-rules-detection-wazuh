title: DNS Query to External Interaction Domains
id: aff715fa-4dd5-497a-8db3-910bea555566
status: test
description: Detects suspicious DNS queries to known out-of-band interaction domains
author: abdelkhalek
date: 2026-01-01
tags:
  - attack.initial-access
  - attack.t1190
logsource:
  category: dns
detection:
  selection:
    query|contains:
      - ".burpcollaborator.net"
      - ".canarytokens.com"
      - ".ceye.io"
      - ".interact.sh"
      - ".oast.fun"
      - ".oast.live"
      - ".oastify.com"
      - ".requestbin.net"
      - ".dnslog.cn"
  condition: selection
level: high