<!-- =====================================================================
     Wazuh Agent Configuration - SIGMA Rules Detection Project
     File location: /var/ossec/etc/ossec.conf
     ===================================================================== -->

<ossec_config>

  <!-- Local File Monitoring (FIM) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories check_all="yes" realtime="yes">/var/log</directories>
    <directories check_all="yes" realtime="yes">/etc</directories>
  </syscheck>

  <!-- Web Server Logs (for web_recon Sigma rule) -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <!-- DNS Logs (for dns_interaction Sigma rule) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

</ossec_config>